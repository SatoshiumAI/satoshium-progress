<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>

  <body>
    <header class="topbar">
      <div class="wrap">
        <div class="brand">
          <div class="mark">S</div>
          <div class="brandtext">
            <div class="name">SATOSHIUM</div>
            <div class="tag">AI, governed by Bitcoin</div>
          </div>
        </div>

        <nav class="nav">
          <a href="{{ '/' | relative_url }}"
             class="{% if page.nav == 'home' %}active{% endif %}">Home</a>

          <a href="{{ '/architecture.html' | relative_url }}"
             class="{% if page.nav == 'architecture' %}active{% endif %}">Architecture</a>

          <a href="{{ '/systems.html' | relative_url }}"
             class="{% if page.nav == 'systems' %}active{% endif %}">Systems</a>

          <a href="{{ '/services.html' | relative_url }}"
             class="{% if page.nav == 'services' %}active{% endif %}">Services</a>

          <a href="{{ '/education.html' | relative_url }}"
             class="{% if page.nav == 'education' %}active{% endif %}">Education</a>

          <a href="{{ '/labs/index.html' | relative_url }}"
             class="{% if page.nav == 'labs' %}active{% endif %}">Labs</a>

          <a href="{{ '/roadmap.html' | relative_url }}"
             class="{% if page.nav == 'roadmap' %}active{% endif %}">Roadmap</a>

          <a href="{{ '/changelog.html' | relative_url }}"
             class="{% if page.nav == 'changelog' %}active{% endif %}">Changelog</a>

          <a href="{{ '/repo-map.html' | relative_url }}"
             class="{% if page.nav == 'repomap' %}active{% endif %}">Repo Map</a>

          <a href="https://satoshium.ai" target="_blank" rel="noopener">Main Site</a>
        </nav>
      </div>
    </header>

    <main class="wrap content">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="wrap">
        <div class="footline">Built in public. No hype. Visible progress only.</div>
        <div class="footlinks">
          <a href="https://github.com/SatoshiumAI" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
