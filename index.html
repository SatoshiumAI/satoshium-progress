<!doctype html>
<html>
<head>
<title>Site Moved</title>
</head>
<style>

/* ===== Core Theme ===== */

:root{
 --card-wm: url('./assets/seal.png');
 --bg:#07090d;
 --panel:#0c1018;
 --text:#e8edf7;
 --muted:#9aa7bd;
 --gold:#d6a34a;
 --gold2:#f4c36a;
 --line:rgba(214,163,74,.18);
}

*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
line-height:1.55
}
body{
 padding-top:80px;
}
a{color:var(--gold2);text-decoration:none}
a:hover{color:var(--gold)}

.wrap{max-width:980px;margin:0 auto;padding:0 18px}

/* ===== Layout ===== */

.content{
padding:34px 18px 60px
}

h1,h2{
margin:0 0 10px
}

h1{
font-size:30px;
color:var(--gold2)
}

h2{
font-size:20px;
color:var(--gold2);
margin-top:26px
}

p,li{
color:var(--text)
}

hr{
border:none;
border-top:1px solid var(--line);
margin:22px 0
}

/* ===== Cards ===== */

.card{
position: relative;
overflow: hidden;

background: linear-gradient(
to bottom right,
rgba(12,16,24,.94),
rgba(12,16,24,.88)
);

border:1px solid var(--line);
border-radius:16px;

padding:16px 16px;
margin:16px 0;

box-shadow:
0 0 0 1px rgba(214,163,74,.08),
0 20px 50px rgba(0,0,0,.45);
}

.card::before{
content:"";
position:absolute;
inset:-60px;
background-image: var(--card-wm);
background-repeat:no-repeat;
background-size: min(720px, 70vw);
background-position: right -140px center;
opacity:0.028;
filter: blur(1px);
pointer-events:none;
z-index:0;
}

.card > *{
position:relative;
z-index:1
}
.card {
  transition: transform .18s ease, box-shadow .18s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(0,0,0,.35);
}

.card {
 border: 1px solid rgba(214,163,74,.15);
}

.muted{
color:var(--muted)
}

.footer{
border-top:1px solid var(--line);
padding:18px 0 32px;
color:var(--muted)
}

/* ===== Small Platform Header Panel ===== */
 
.systems-catalog{
margin-top:22px;
margin-bottom:26px;
padding:16px 18px;
border:1px solid var(--line);
border-radius:14px;
background:linear-gradient(to bottom right, rgba(12,16,24,.92), rgba(12,16,24,.86));
box-shadow:0 0 0 1px rgba(214,163,74,.06), 0 10px 30px rgba(0,0,0,.35);
}

.catalog-title{
font-size:13px;
font-weight:700;
letter-spacing:.12em;
text-transform:uppercase;
color:var(--gold2);
margin-bottom:6px;
}

.catalog-description{
font-size:14px;
color:var(--text);
margin-bottom:10px;
}

.catalog-meta{
font-size:12px;
color:var(--muted);
letter-spacing:.04em;
}
 
/* ===== Pills ===== */

.pill{
display:inline-flex;
align-items:center;
gap:8px;
padding:8px 10px;
border:1px solid var(--line);
border-radius:999px;
background:rgba(214,163,74,.08);
color:var(--gold2);
font-size:12px;
font-weight:700
}

ul{
margin:8px 0 0 18px
}

</style>
<body style="font-family:sans-serif;text-align:center;margin-top:120px">

<h1>Satoshium Progress Site Retired</h1>

</script>
 
<p>

</p>

<p>

</p>

<p>

</p>

</body>
</html>
